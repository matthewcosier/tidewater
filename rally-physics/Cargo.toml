[package]
name = "tidewater-rally-physics"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { version = "=0.18.0", default-features = false, features = ["std", "bevy_asset", "bevy_scene", "bevy_mesh", "keyboard", "gamepad"] }
avian3d = { version = "=0.5.0", default-features = false, features = ["3d", "f32", "parry-f32", "collider-from-mesh", "bevy_scene"] }
wasm-bindgen = "=0.2.114"

[profile.release]
opt-level = 2
debug = 0

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
