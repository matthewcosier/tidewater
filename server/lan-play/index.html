<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081a27"><title>Tidewater · LAN Play</title><link rel="stylesheet" href="/controller.css"><script type="module" src="/controller.js"></script></head>
<body><main>
<header><strong>Tidewater</strong><span id="status" role="status">Connecting to the Mac…</span><button id="menu" hidden>Menu</button></header>
<section id="screen" aria-label="Game view"><canvas width="960" height="540" aria-label="Live game from the Mac"></canvas>
<div id="lobby"><div class="card"><h1>Play Tidewater</h1><p>Hold the controls to move. Drag the view to look.</p><button id="resume" hidden>Resume game</button><button id="drive" disabled>Drive GT3</button><button id="walk" disabled>Explore on foot</button></div></div></section>
<section id="controls" aria-label="Touch controls" inert>
<div class="group"><button data-key="KeyA" aria-label="Left">◀</button><button data-key="KeyD" aria-label="Right">▶</button></div>
<div class="actions"><button data-key="KeyE">Interact</button><button data-key="Space">Jump</button><button data-key="KeyR">Recover</button></div>
<div class="group"><button data-key="KeyS">Back</button><button class="gas" data-key="KeyW">Forward</button></div>
</section><dialog id="choice"><h2></h2><div></div><button id="cancel">Cancel</button></dialog></main></body></html>
